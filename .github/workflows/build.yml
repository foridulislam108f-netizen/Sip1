name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate project folder
        id: loc
        run: |
          GRADLEW=$(find . -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew পাওয়া যায়নি। রিপোতে প্রজেক্টের ফাইলগুলো আনজিপ করে আপলোড করা হয়েছে কিনা দেখুন।"
            ls -R | head -50
            exit 1
          fi
          DIR=$(dirname "$GRADLEW")
          echo "Project dir: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: ${{ steps.loc.outputs.dir }}

      - name: Make gradlew executable
        working-directory: ${{ steps.loc.outputs.dir }}
        run: chmod +x ./gradlew

      - name: Build Debug APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: ./gradlew assembleLiteDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SipDialer-debug-apk
          path: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/lite/debug/*.apk
          if-no-files-found: error
